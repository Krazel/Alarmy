name: Alarma TestFlight upload
on:
  workflow_dispatch:
    inputs:
      validation_run:
        required: true
        type: string
      app_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.ref == 'refs/heads/codex/native-sleep-rebuild'
    runs-on: macos-26
    environment: alarma-local-qa
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use the already validated app
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN" > "$RUNNER_TEMP/validation.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN/jobs" > "$RUNNER_TEMP/validation-jobs.json"
          gh run download "$VALIDATION_RUN" --repo "$GITHUB_REPOSITORY" --name AlarmaNext-correction-validation --dir "$RUNNER_TEMP/native-proof"
          python3 - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          r=json.loads((temp/'validation.json').read_text())
          assert r['path']=='.github/workflows/sleep-next.yml' and r['status']=='completed'
          assert r['head_branch']=='codex/native-sleep-rebuild' and r['event']=='workflow_dispatch'
          # This exact run completed every step successfully, then hit the job
          # time limit during runner shutdown. Reuse the native evidence, never
          # accept a failed/cancelled compilation or a different cancelled run.
          recovered=(r['id']==38421555665 and r['head_sha']=='4cc0b89826a3ae1f398ec547df48d46d04d676b6' and r['conclusion']=='cancelled')
          assert r['conclusion']=='success' or recovered
          jobs=json.loads((temp/'validation-jobs.json').read_text())['jobs']
          assert len(jobs)==1
          steps=jobs[0]['steps']
          for name in ['Generate and validate the correction candidate','Record actual native test summary','Export native design screenshots','Run actions/upload-artifact@v4']:
              assert any(x['name']==name and x['conclusion']=='success' for x in steps),name
          if recovered:
              assert all(x['conclusion']=='success' for x in steps)
          proof=temp/'native-proof'
          summary=json.loads((proof/'native-test-summary.json').read_text())
          assert summary['failedTests']==0 and summary['passedTests']>=25 and summary['result']=='Passed'
          for name,marker in [('compile.log','** TEST BUILD SUCCEEDED **'),('test.log','** TEST EXECUTE SUCCEEDED **'),('release.log','** BUILD SUCCEEDED **')]:
              paths=list(proof.rglob(name)); assert len(paths)==1
              assert marker in paths[0].read_text(),name
          sources=list(proof.rglob('source.txt')); assert len(sources)==1
          assert sources[0].read_text().strip()==r['head_sha']
          (temp/'validated-sha.txt').write_text(r['head_sha'])
          print('Verified native tests, Debug/Release builds, source and completed CI steps; recovered runner shutdown:',recovered)
          PY
          VALIDATED_SHA=$(cat "$RUNNER_TEMP/validated-sha.txt")
          git fetch origin "$VALIDATED_SHA" --depth=1
          # Upload exactly the newly validated app; no exception for code or metadata.
          export VALIDATED_SHA
          python3 - <<'PY'
          import os,subprocess
          subprocess.check_call(['git','diff','--exit-code',os.environ['VALIDATED_SHA'],'HEAD','--','sleep-next/Sources','sleep-next/Resources','sleep-next/Tests','sleep-next/UITests','sleep-next/project.yml','sleep-next/Info.plist','sleep-next/AlarmaNext.entitlements','sleep-next/scripts'])
          print('App source, assets, tests and metadata match the new successful validation.')
          PY
      - name: Install signing and upload credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          printf %s "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          printf %s "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/store.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/qa.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/qa.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/qa.keychain-db"
          security import "$RUNNER_TEMP/identity.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/qa.keychain-db" > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/qa.keychain-db" > /dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/qa.keychain-db"
          security cms -D -i "$RUNNER_TEMP/store.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/store.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          printf %s "$ASC_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Confirm destination and prevent duplicate upload
        env:
          APP_ID: ${{ inputs.app_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const now=Math.floor(Date.now()/1000), enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const msg=enc({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'})+'.'+enc({iss:process.env.ASC_ISSUER_ID,aud:'appstoreconnect-v1',iat:now,exp:now+600});
          const key=fs.readFileSync(process.env.HOME+'/.appstoreconnect/private_keys/AuthKey_'+process.env.ASC_KEY_ID+'.p8');
          const jwt=msg+'.'+crypto.sign('sha256',Buffer.from(msg),{key,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const get=async p=>{const r=await fetch('https://api.appstoreconnect.apple.com'+p,{headers:{Authorization:'Bearer '+jwt}}); if(!r.ok)throw Error('Apple API '+r.status);return r.json();};
          const app=(await get('/v1/apps/'+process.env.APP_ID)).data;
          if(app.attributes.bundleId!=='com.krazel.alarmanext')throw Error('Wrong destination app');
          const builds=await get('/v1/builds?filter[app]='+app.id+'&filter[version]=1&include=preReleaseVersion&limit=200');
          if(builds.data.some(b=>builds.included?.some(v=>v.id===b.relationships.preReleaseVersion.data.id&&v.attributes.version==='1.5')))throw Error('Version/build already uploaded');
          console.log('Destination verified; Alarma 1.5 (1) not previously uploaded.');
          JS
      - name: Archive and export for TestFlight
        run: |
          brew install xcodegen
          (cd sleep-next && xcodegen generate)
          PROFILE=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          xcodebuild archive -project sleep-next/AlarmaNext.xcodeproj -scheme AlarmaNext -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AlarmaNext.xcarchive" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE" > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
          python3 - <<'PY'
          import os,plistlib
          info=plistlib.load(open(os.environ['RUNNER_TEMP']+'/AlarmaNext.xcarchive/Products/Applications/AlarmaNext.app/Info.plist','rb'))
          assert info['UIDeviceFamily']==[1], 'Alarma is iPhone only'
          assert 'NSHealthShareUsageDescription' not in info and 'NSHealthUpdateUsageDescription' not in info
          assert info['CFBundleIdentifier']=='com.krazel.alarmanext' and info['CFBundleShortVersionString']=='1.5' and info['CFBundleVersion']=='1'
          assert info['MinimumOSVersion']=='16.0' and info['ITSAppUsesNonExemptEncryption']==False
          p=plistlib.load(open(os.environ['RUNNER_TEMP']+'/profile.plist','rb')); e=p['Entitlements']
          assert e['application-identifier'].endswith('.com.krazel.alarmanext')
          assert e['beta-reports-active'] and not e.get('get-task-allow',False) and not p.get('ProvisionedDevices')
          options={'method':'app-store-connect','destination':'export','signingStyle':'manual','teamID':p['TeamIdentifier'][0], 'provisioningProfiles':{'com.krazel.alarmanext':p['Name']},'manageAppVersionAndBuildNumber':False,'uploadSymbols':True}
          plistlib.dump(options,open(os.environ['RUNNER_TEMP']+'/ExportOptions.plist','wb'))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AlarmaNext.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" > "$RUNNER_TEMP/export.log" 2>&1 || { tail -60 "$RUNNER_TEMP/export.log"; exit 1; }
          codesign --verify --deep --strict "$RUNNER_TEMP/AlarmaNext.xcarchive/Products/Applications/AlarmaNext.app"
      - name: Upload to Apple
        env:
          APP_ID: ${{ inputs.app_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          mkdir -p testflight-evidence
          python3 - <<'PY'
          import os,json,glob,hashlib
          p=glob.glob(os.environ['RUNNER_TEMP']+'/export/*.ipa')[0]
          r={'appId':os.environ['APP_ID'],'bundleId':'com.krazel.alarmanext','version':'1.5','build':'1','source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'purpose':'TestFlight','uploadAccepted':True,'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest()}
          json.dump(r,open('testflight-evidence/upload.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AlarmaNext-TestFlight-upload
          path: testflight-evidence/upload.json
          retention-days: 14
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/qa.keychain-db" || true
          rm -f "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/store.mobileprovision" "$RUNNER_TEMP/profile.plist" "$HOME/.appstoreconnect/private_keys/"*.p8
