name: Alarma native correction validation
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Focused verification scope
        type: choice
        options: [october, design, analysis, categories, onda, onda_visual, onda_time, feedback, diary, diary_polish, gradual, insights, recognition_fix, catalogue, ui_revision]
        default: october
permissions:
  contents: read
concurrency:
  group: sleep-next-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    # Owner selected PUBLIC Alarma on 2026-10-12 for free standard Actions.
    if: github.event.repository.private == false && github.ref == 'refs/heads/codex/native-sleep-rebuild'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate the correction candidate
        env:
          VALIDATION_SCOPE: ${{ inputs.scope }}
        run: |
          brew install xcodegen
          bash sleep-next/scripts/validate-october.sh
      - name: Record actual native test summary
        if: always()
        env:
          VALIDATION_SCOPE: ${{ inputs.scope }}
        run: |
          RESULT=$(find sleep-next/Evidence/october-2026 -maxdepth 3 -type d -name Tests.xcresult -print -quit)
          xcrun xcresulttool get test-results summary --path "$RESULT" > native-test-summary.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('native-test-summary.json'))
          minimum={'design':5,'analysis':13,'categories':4,'onda':9,'onda_visual':2,'onda_time':6,'feedback':11,'diary':13,'diary_polish':4,'gradual':10,'insights':16,'recognition_fix':20,'catalogue':1,'ui_revision':9}.get(os.environ.get('VALIDATION_SCOPE'),15)
          assert r['failedTests']==0 and r['passedTests']>=minimum, r
          print('Passed native tests:',r['passedTests'])
          PY
      - name: Export native design screenshots
        if: always() && (inputs.scope == 'design' || inputs.scope == 'analysis' || inputs.scope == 'categories' || inputs.scope == 'onda' || inputs.scope == 'onda_visual' || inputs.scope == 'feedback' || inputs.scope == 'diary' || inputs.scope == 'diary_polish' || inputs.scope == 'insights' || inputs.scope == 'recognition_fix' || inputs.scope == 'catalogue' || inputs.scope == 'ui_revision')
        run: |
          RESULT=$(find sleep-next/Evidence/october-2026 -maxdepth 3 -type d -name Tests.xcresult -print -quit)
          if [[ -n "$RESULT" ]]; then
            xcrun xcresulttool export attachments --path "$RESULT" --output-path design-runtime
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlarmaNext-correction-validation
          path: |
            native-test-summary.json
            design-runtime/
            sleep-next/Evidence/october-2026/native-*/compile.log
            sleep-next/Evidence/october-2026/native-*/Tests.xcresult
            sleep-next/Evidence/october-2026/native-*/test.log
            sleep-next/Evidence/october-2026/native-*/release.log
            sleep-next/Evidence/october-2026/native-*/source.txt
            sleep-next/Evidence/october-2026/native-*/xcode.txt
          retention-days: 3
